events {}
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # First-party proxy for the SpatialReal driving WebSocket (SDK mode).
        # The browser shim rewrites wss://api.intl.spatialwalk.cloud/... to
        # wss://www.sakinah.live/_spatial-ws/api/... so ad/DNS filters can't
        # block it. We terminate here and forward to the real upstream over TLS.
        location /_spatial-ws/api/ {
            proxy_pass https://api.intl.spatialwalk.cloud/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host api.intl.spatialwalk.cloud;
            proxy_ssl_server_name on;
            proxy_ssl_name api.intl.spatialwalk.cloud;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /_spatial-ws/health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
